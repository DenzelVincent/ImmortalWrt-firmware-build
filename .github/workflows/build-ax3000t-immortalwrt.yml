# ============================================================
# ImmortalWrt 固件编译工作流 (小米 AX3000T)
# 目标设备: Xiaomi Mi Router AX3000T (MT7981)
# 源码来源: https://github.com/hanwckf/immortalwrt-mt798x.git (openwrt-21.02 分支)
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Build ImmortalWrt Firmware (AX3000T)
on:
  # 定时编译 (默认关闭，取消注释即可启用，cron 使用 UTC 时间)
  # schedule:
  #   - cron: "0 0 20 * *"
  # 手动触发：可在 GitHub Actions 页面点击 "Run workflow" 按钮
  workflow_dispatch:
    inputs:
      # 清空 dl 下载缓存，本趟全量重下、收尾重灌
      clean_dl_cache:
        description: 先清空 dl 下载缓存再编译（改了 package 的源码版本/地址、或怀疑 dl 里是旧包时勾选）
        type: boolean
        default: false
      # 清空 ccache 编译对象缓存，本趟全部未命中、收尾重灌
      clean_ccache:
        description: 先清空 ccache 编译对象缓存再编译（怀疑产物不对、需排除 ccache 时勾选）
        type: boolean
        default: false
      # Release 发布开关：关闭时只上传 artifact，不建 Release、不清理旧 runs
      release:
        description: 编译成功后创建 GitHub Release（默认关闭，关闭时只保留 artifact）
        type: boolean
        default: false

env:
  # 源码仓库地址
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x.git
  # 源码分支 (基于 OpenWrt 21.02)
  REPO_BRANCH: openwrt-21.02
  # 设备配置文件（复制成 openwrt/.config）与缓存 key 前缀；改名须同步两条 cache key 里的文件名
  CONFIG_FILE: ax3000t.config
  CONFIG_NAME: ax3000t
  # defconfig 自检的期望符号，换 target/设备时与上面成对改
  EXPECT_TARGET: CONFIG_TARGET_mediatek_mt7981
  EXPECT_DEVICE: CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_xiaomi_mi-router-ax3000t
  # 两个自定义脚本 = 流程里的两个插入点，执行阶段见各行注释
  # 1) ./scripts/feeds update -a 之前 —— 增删第三方 feed 源
  SCRIPT_ADD_FEED_SOURCES: add-feed-sources.sh
  # 2) make defconfig 之后 —— 改固件出厂默认值 (默认 IP、DHCP 等)
  SCRIPT_SET_FIRMWARE_DEFAULTS: set-firmware-defaults.sh
  # 编译环境时区
  TZ: Asia/Shanghai
  # 可选覆盖：本仓库根存在该文件时才覆盖源码自带 feeds
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    name: build-firmware
    runs-on: ubuntu-22.04

    permissions:
      actions: write    # 允许上传 artifact 与保存编译缓存

    steps:
    # ----------------------------------------------------------
    # 步骤 1: 释放磁盘空间（删除 runner 上的 Android/.NET/Haskell 等工具链）
    # ----------------------------------------------------------
    - name: Free disk space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    # ----------------------------------------------------------
    # 步骤 2: 检出本仓库（设备配置文件与自定义脚本）
    # ----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    # ----------------------------------------------------------
    # 步骤 3: 安装编译依赖，设置时区并准备 /srcdir
    # ----------------------------------------------------------
    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    # ----------------------------------------------------------
    # 步骤 4: 克隆源码到 /srcdir，解析固件版本号供产物名使用
    # ----------------------------------------------------------
    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt
        raw="$(grep -m1 -F 'VERSION_NUMBER:=$(if ' openwrt/include/version.mk)"
        ver="${raw%)}"
        ver="${ver##*,}"
        [ -n "$ver" ] || { echo "::error::没能从 openwrt/include/version.mk 解析出 VERSION_NUMBER"; exit 1; }
        echo "FW_VERSION=$ver" >> $GITHUB_ENV

    # ----------------------------------------------------------
    # 步骤 5: 缓存 dl/（源码包）与 openwrt/.ccache（编译对象），Clear 排在同层 Cache 之前
    # ----------------------------------------------------------
    - name: Clear dl cache
      if: ${{ inputs.clean_dl_cache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-dl-")) | .id' | \
          xargs -r gh cache delete
        left=$(gh cache list --limit 100 --json key | \
          jq '[.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-dl-"))] | length')
        if [ "$left" != "0" ]; then
          echo "::error::清理后 ${{ env.CONFIG_NAME }}-dl- 前缀仍剩 $left 条缓存条目，本趟不算冷编译"
          exit 1
        fi

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ env.CONFIG_NAME }}-dl-${{ hashFiles('feeds.conf.default', 'ax3000t.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-dl-

    - name: Clear ccache
      if: ${{ inputs.clean_ccache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-ccache-")) | .id' | \
          xargs -r gh cache delete
        left=$(gh cache list --limit 100 --json key | \
          jq '[.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-ccache-"))] | length')
        if [ "$left" != "0" ]; then
          echo "::error::清理后 ${{ env.CONFIG_NAME }}-ccache- 前缀仍剩 $left 条缓存条目，本趟不算冷编译"
          exit 1
        fi

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ env.CONFIG_NAME }}-ccache-${{ hashFiles('feeds.conf.default', 'ax3000t.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-ccache-

    # ----------------------------------------------------------
    # 步骤 6: 执行 add-feed-sources.sh 增删第三方 feed 源
    # ----------------------------------------------------------
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SCRIPT_ADD_FEED_SOURCES
        cd openwrt
        $GITHUB_WORKSPACE/$SCRIPT_ADD_FEED_SOURCES

    # ----------------------------------------------------------
    # 步骤 7: 更新 feeds，拉取各源的软件包定义
    # ----------------------------------------------------------
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # ----------------------------------------------------------
    # 步骤 8: 安装 feeds 到编译环境
    # ----------------------------------------------------------
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ----------------------------------------------------------
    # 步骤 9: 复制设备配置并追加 CONFIG_CCACHE=y，make defconfig 后自检并执行出厂默认值脚本
    # ----------------------------------------------------------
    - name: Load custom config
      run: |
        [ -e files ] && mv files openwrt/files
        if [ ! -e "$CONFIG_FILE" ]; then
          echo "::error::缺少编译配置文件 $CONFIG_FILE（应位于本仓库根目录，检查工作流 CONFIG_FILE 与分支上的文件名是否一致）"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config
        printf '\n%s\n' 'CONFIG_CCACHE=y' >> openwrt/.config
        chmod +x $SCRIPT_SET_FIRMWARE_DEFAULTS
        cd openwrt
        make defconfig
        # 配置文件与源码树不匹配时 defconfig 不报错，而是回落默认 target 编到底
        for sym in "$EXPECT_TARGET" "$EXPECT_DEVICE"; do
          grep -q "^${sym}=" .config || {
            echo "::error::defconfig 结果里没有 $sym，$CONFIG_FILE 与源码 $REPO_URL ($REPO_BRANCH) 不匹配"
            exit 1
          }
        done
        grep -q '^CONFIG_CCACHE=y' .config || {
          echo "::error::CONFIG_CCACHE=y 没能进入 defconfig 结果，检查 $CONFIG_FILE 里是否有 CONFIG_DEVEL=y"
          exit 1
        }
        $GITHUB_WORKSPACE/$SCRIPT_SET_FIRMWARE_DEFAULTS

    # ----------------------------------------------------------
    # 步骤 10: 预下载源码包，避免编译期网络超时
    # ----------------------------------------------------------
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8 V=11

    # ----------------------------------------------------------
    # 步骤 11: 编译固件（同级并发重试一次，仍失败降级 -j1 V=s）
    # ----------------------------------------------------------
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j$(nproc) || make -j1 V=s || exit 1
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y-%m-%d-%H-%M")" >> $GITHUB_ENV

    # ----------------------------------------------------------
    # 步骤 12: 检查磁盘使用情况
    # ----------------------------------------------------------
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # ----------------------------------------------------------
    # 步骤 13: 按型号把可刷写镜像收进 release/<型号>/
    # ----------------------------------------------------------
    - name: Organize firmware files
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        find . -maxdepth 1 -type f ! -name '*.bin' ! -name '*.itb' -delete
        # 固件文件名形如 immortalwrt-<target>-<subtarget>-<profile>-<类型>.bin，型号 = profile 去掉 -stock 后缀
        prefix="immortalwrt-$(basename "$(dirname "$PWD")")-$(basename "$PWD")-"
        for f in *.bin *.itb; do
          [ -e "$f" ] || continue
          base="${f#"$prefix"}"
          prof="${base%-initramfs-kernel.bin}"
          prof="${prof%-squashfs-sysupgrade.bin}"
          prof="${prof%-squashfs-factory.bin}"
          model="${prof%-stock}"
          # 目录名与文件名一并去掉上游的 mi-router- 段（只改名字，镜像内的支持设备串不变）
          dst="${f/xiaomi_mi-router-/xiaomi_}"
          model="${model/xiaomi_mi-router-/xiaomi_}"
          mkdir -p "$GITHUB_WORKSPACE/release/$model"
          mv "$f" "$GITHUB_WORKSPACE/release/$model/$dst"
        done
        if find "$GITHUB_WORKSPACE/release" -maxdepth 1 -type d -name '*mi-router*' | grep -q .; then
          echo "::error::型号目录名仍含 mi-router 段"; exit 1;
        fi
        echo "status=success" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 14: 按型号上传散文件目录为 artifact（tar.zst 打包由 release job 执行）
    # ----------------------------------------------------------
    - name: Upload firmware xiaomi_ax3000t
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && hashFiles('release/xiaomi_ax3000t/*') != '' && !cancelled()
      with:
        name: ImmortalWrt_${{ env.FW_VERSION }}_AX3000T${{ env.FILE_DATE }}
        path: release/xiaomi_ax3000t

    - name: Upload firmware xiaomi_ax3000t-an8855
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && hashFiles('release/xiaomi_ax3000t-an8855/*') != '' && !cancelled()
      with:
        name: ImmortalWrt_${{ env.FW_VERSION }}_AX3000T-AN8855${{ env.FILE_DATE }}
        path: release/xiaomi_ax3000t-an8855

  # ------------------------------------------------------------
  # Release 发布 job：编译成功后打包上传 Release，并清理旧 runs / Releases
  # 由 workflow_dispatch 的 release 开关控制，默认关闭；关闭时只保留 artifact
  # ------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && !cancelled() && inputs.release

    permissions:
      contents: write   # 允许创建 Release
      actions: write    # 允许删除/管理 workflow runs

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 下载本次 run 的固件 artifact（每个解压到同名子目录）
      # ----------------------------------------------------------
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ImmortalWrt_*
          merge-multiple: false
          path: artifacts

      # ----------------------------------------------------------
      # 步骤 2: 把各型号散文件目录打包成 <型号>.tar.zst（型号名从 artifact 名反解，约定见步骤 3）
      # ----------------------------------------------------------
      - name: Package firmware by device
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            model="$(echo "$name" | sed -E 's/^ImmortalWrt_[^_]*_//; s/_[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}$//')"
            tar --zstd -cf "release/${model}.tar.zst" -C "$d" .
            echo "Packaged $model -> release/${model}.tar.zst"
          done
          ls -l release/

      # ----------------------------------------------------------
      # 步骤 3: 版本号与时间戳从 artifact 名回取，生成 Release 标签与说明
      # ----------------------------------------------------------
      - name: Generate release tag
        id: tag
        run: |
          # 约定 artifact 名 ImmortalWrt_<版本>_<型号>_<日期-时分>；build job 的 env 不跨 job，只能回取
          first="$(ls -1 artifacts | head -1)"
          [[ "$first" =~ ^ImmortalWrt_([0-9A-Za-z.-]+)_(.+)_([0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2})$ ]] || { echo "::error::artifact 名不符合命名约定: $first"; exit 1; }
          fw="${BASH_REMATCH[1]}"
          ts="${BASH_REMATCH[3]}"
          echo "release_tag=ImmortalWrt_${fw}_AX3000T_${ts}" >> $GITHUB_OUTPUT
          touch release.txt
          echo "ImmortalWrt ${fw} for Xiaomi Mi Router AX3000T (MT7981, hanwckf openwrt-21.02)" >> release.txt
          echo "" >> release.txt
          echo "Included variants:" >> release.txt
          echo "- Xiaomi Mi Router AX3000T (standard / stock)" >> release.txt
          echo "- Xiaomi Mi Router AX3000T (AN8855 交换芯片，需在本分支 ax3000t.config 勾选)" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 4: 上传固件压缩包到 GitHub Release
      # ----------------------------------------------------------
      - name: Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: release/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 步骤 5: 清理旧 workflow runs（保留 7 天，至少 3 条）
      # ----------------------------------------------------------
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      # ----------------------------------------------------------
      # 步骤 6: 清理旧 Release（本设备标签保留最近 3 个，连 tag 一起删）
      # ----------------------------------------------------------
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outcome == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
          delete_tag_pattern: _AX3000T_
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
