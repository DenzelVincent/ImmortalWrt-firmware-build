# ============================================================
# U-Boot 编译工作流
# 支持机型: 小米 AX3000T / CMCC RAX3000M (MT7981 平台)
# 使用矩阵策略并行编译各机型的不同硬件版本
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Build U-Boot (MT7981)

on:
  # 定时编译 (默认关闭，取消注释即可启用，cron 使用 UTC 时间)
  # schedule:
  #   - cron: "0 2 15 * *"
  # 手动触发：可在 GitHub Actions 页面点击 "Run workflow" 按钮
  workflow_dispatch:
    inputs:
      # Release 发布开关：默认关闭，只上传 artifact，不创建 GitHub Release、不清理旧 runs/Releases。
      release:
        description: 编译成功后创建 GitHub Release（默认关闭，关闭时只保留 artifact）
        type: boolean
        default: false

env:
  # 源码仓库地址 (hanwckf 的 MT798x bootloader)
  REPO_URL: https://github.com/hanwckf/bl-mt798x.git
  # 源码分支
  REPO_BRANCH: master
  # 编译环境时区
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build U-Boot
    runs-on: ubuntu-latest

    permissions:
      actions: write    # 允许上传编译产物 artifact

    # ----------------------------------------------------------
    # 矩阵：每个 board 一个独立 runner 并行编译，增删机型改这里
    # 上游 bl-mt798x 另有 ax3000t_an8855 (外置交换芯片) 与 cmcc_rax3000m-emmc (eMMC) 两种 board
    # MULTI_LAYOUT=1 时 build.sh 取 <soc>_<board>_multi_layout_defconfig，上游只为 ax3000t 系列提供该配置，
    # 所以 cmcc_rax3000m 必须 multi_layout=0，否则报 defconfig not found
    # ----------------------------------------------------------
    strategy:
      matrix:
        include:
          - board: ax3000t
            multi_layout: 1
          - board: cmcc_rax3000m
            multi_layout: 0

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 检出本仓库
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@main

      # ----------------------------------------------------------
      # 步骤 2: 安装 aarch64 交叉编译工具链和依赖（MT7981 是 ARM64），设置时区并准备 /srcdir
      # ----------------------------------------------------------
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # gcc-aarch64-linux-gnu 交叉编译器 + bootloader 所需的 flex/bison/dtc/openssl
          sudo -E apt-get -qq install gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler

          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

          sudo timedatectl set-timezone "$TZ"
          
          sudo mkdir -p /srcdir
          sudo chown $USER:$GROUPS /srcdir

      # ----------------------------------------------------------
      # 步骤 3: 克隆 U-Boot 源码到 /srcdir（磁盘更大），软链接回工作区
      # ----------------------------------------------------------
      - name: Clone Source Repository
        working-directory: /srcdir
        run: |
           echo "Free space:"
            df -hT $PWD
            git clone --depth 1 $REPO_URL -b $REPO_BRANCH u-boot
            ln -sf /srcdir/u-boot $GITHUB_WORKSPACE/u-boot      

      # ----------------------------------------------------------
      # 步骤 4: 编译 U-Boot（SOC/BOARD/MULTI_LAYOUT/FIXED_MTDPARTS 由上游 build.sh 读取，multi_layout 见矩阵说明）
      # ----------------------------------------------------------
      - name: Compile U-Boot
        id: compile
        run: |
          cd u-boot
          SOC=mt7981 BOARD=${{ matrix.board }} MULTI_LAYOUT=${{ matrix.multi_layout }} FIXED_MTDPARTS=1 ./build.sh
          
          echo "FILE_DATE=_$(date +"%Y-%m-%d-%H-%M")" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 5: 产物只留 *.bin（上游 output 里的 fip/bl2 可刷镜像），防中间文件混入
      # ----------------------------------------------------------
      - name: Clean U-Boot output
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          find u-boot/output -type f ! -name '*.bin' -delete
          ls -l u-boot/output

      # ----------------------------------------------------------
      # 步骤 6: 每个 board 的 output 目录原样上传为独立 artifact（tar.zst 打包由 release job 执行）
      # ----------------------------------------------------------
      - name: Upload U-Boot output
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          name: u-boot_${{ matrix.board }}${{ env.FILE_DATE }}
          path: u-boot/output

  # ------------------------------------------------------------
  # Release 发布 job：全部 board 编译成功后统一建 Release（matrix 各 job 各自建会同 tag 重复）
  # 由 workflow_dispatch 的 release 开关控制，默认关闭；关闭时只保留 artifact
  # ------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && !cancelled() && inputs.release

    permissions:
      contents: write   # 允许创建 Release
      actions: write    # 允许删除/管理 workflow runs

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 下载本次 run 的全部 artifact（每个解压到同名子目录）
      # ----------------------------------------------------------
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ----------------------------------------------------------
      # 步骤 2: 打包成 <board>-uboot.tar.zst（board 名从 artifact 名反解，-uboot 后缀与同名固件包区分）
      # ----------------------------------------------------------
      - name: Package U-Boot by board
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            board="$(echo "$name" | sed -E 's/^u-boot_//; s/_[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}$//')"
            tar --zstd -cf "release/${board}-uboot.tar.zst" -C "$d" .
            echo "Packaged $board -> release/${board}-uboot.tar.zst"
          done
          ls -l release/

      # ----------------------------------------------------------
      # 步骤 3: 时间戳从 artifact 名回取，生成 Release 标签 U-Boot_<时间戳> 与说明
      # ----------------------------------------------------------
      - name: Generate release tag
        id: tag
        run: |
          first="$(ls -1 artifacts | head -1)"
          [[ "$first" =~ ^u-boot_.+_([0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2})$ ]] || { echo "::error::artifact 名不符合命名约定: $first"; exit 1; }
          ts="${BASH_REMATCH[1]}"
          echo "release_tag=U-Boot_${ts}" >> $GITHUB_OUTPUT
          touch release.txt
          echo "U-Boot for Xiaomi AX3000T & CMCC RAX3000M" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 4: 上传 U-Boot 压缩包到 GitHub Release
      # ----------------------------------------------------------
      - name: Upload U-Boot to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: release/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 步骤 5: 清理旧 workflow runs（保留 7 天，至少 3 条）
      # ----------------------------------------------------------
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      # ----------------------------------------------------------
      # 步骤 6: 清理旧 Release（本组标签保留最近 3 个，连 tag 一起删）
      # ----------------------------------------------------------
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outcome == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
          delete_tag_pattern: ^U-Boot_
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
