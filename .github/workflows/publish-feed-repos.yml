# ============================================================
# 自建 feed 源发布工作流 (AN7581 / ImmortalWrt)
# 用途: 只编译发布集里的 app 包并签名成 apk 仓库, 发布到本仓库 GitHub Pages,
#       不产出固件镜像 —— 用于"源码仓库更新了 app, 想直接给设备端 apk add"的场景。
# 与固件编译的分工: build-an7581-immortalwrt.yml 的 publish_feeds 开关走整镜像那趟顺带发布;
#       本工作流跳过内核与镜像组装, 代价见下面 "Compile feed packages" 步骤注释。
# 发布清单: files/etc/apk/repositories.d/customfeeds.list (出厂源清单即发布清单, 不在这里重列)
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Publish feed repos (AN7581)
on:
  workflow_dispatch:
    inputs:
      # 两个缓存开关与固件编译工作流同语义、同 key 前缀，命中同一份缓存条目。
      clean_dl_cache:
        description: 先清空 dl 下载缓存再编译（改了 package 的源码版本/地址、或怀疑 dl 里是旧包时勾选）
        type: boolean
        default: false
      clean_ccache:
        description: 先清空 ccache 编译对象缓存再编译（怀疑产物不对、需排除 ccache 时勾选）
        type: boolean
        default: false

env:
  # 源码仓库与分支：与固件编译工作流必须完全一致，否则产出的包与该机型基线不匹配
  REPO_URL: https://github.com/DenzelVincent/ponwrt.git
  REPO_BRANCH: master
  # 复用同一份配置文件：选中哪些包（CONFIG_PACKAGE_*）与整镜像编译保持同一事实来源
  # hashFiles 只接受字面量，改名须同步下面两条 cache key 里的文件名
  CONFIG_FILE: an7581.config
  # cache key 前缀 = 配置文件名去掉 .config，与固件工作流同值才能共用缓存
  CONFIG_NAME: an7581
  # 本工作流的三个自定义脚本：追加 feed 源 → 只编发布集的包 → 拷成 Pages 站点目录
  SCRIPT_ADD_FEED_SOURCES: add-feed-sources.sh
  SCRIPT_BUILD_FEED_PACKAGES: build-feed-packages.sh
  SCRIPT_PUBLISH_FEED_REPOS: publish-feed-repos.sh
  # 编译环境时区
  TZ: Asia/Shanghai
  # 可选覆盖：本仓库根目录存在该文件时才 mv 覆盖源码自带 feeds，当前不存在
  FEEDS_CONF: feeds.conf.default

jobs:
  publish:
    name: publish-feed-repos
    runs-on: ubuntu-24.04

    permissions:
      actions: write    # 允许上传 Pages artifact

    steps:
    # ----------------------------------------------------------
    # 步骤 1: 释放磁盘空间（删除 runner 上的 Android/.NET/Haskell 等工具链）
    # ----------------------------------------------------------
    - name: Free disk space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    # ----------------------------------------------------------
    # 步骤 2: 检出本仓库（配置文件与自定义脚本）
    # ----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    # ----------------------------------------------------------
    # 步骤 3: 安装编译依赖（完整工具链）
    # ----------------------------------------------------------
    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gettext git g++-multilib gcc-multilib gperf help2man intltool \
          libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
          python3 python3-docutils python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    # ----------------------------------------------------------
    # 步骤 4: 克隆源码到 /srcdir（磁盘更大），软链接回工作区
    # ----------------------------------------------------------
    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ----------------------------------------------------------
    # 步骤 5: 缓存 dl/ 与 openwrt/.ccache，key 与固件编译工作流逐字相同，两趟共用同一份缓存
    # Clear ... cache 必须排在同层 Cache 之前，否则本趟仍用旧缓存、开关等于没生效
    # ----------------------------------------------------------
    - name: Clear dl cache
      if: ${{ inputs.clean_dl_cache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 删掉本设备前缀的全部缓存条目（--limit 100 是 API 单页上限）
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-dl-")) | .id' | \
          xargs -r gh cache delete
        # 删净断言：还有残留说明条目超过单页上限或别的 ref 仍有同名前缀，本趟不算冷编译
        left=$(gh cache list --limit 100 --json key | \
          jq '[.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-dl-"))] | length')
        if [ "$left" != "0" ]; then
          echo "::error::清理后 ${{ env.CONFIG_NAME }}-dl- 前缀仍剩 $left 条缓存条目，本趟不算冷编译"
          exit 1
        fi

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ env.CONFIG_NAME }}-dl-${{ hashFiles('feeds.conf.default', 'an7581.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-dl-

    - name: Clear ccache
      if: ${{ inputs.clean_ccache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 删掉本设备前缀的全部缓存条目（--limit 100 是 API 单页上限）
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-ccache-")) | .id' | \
          xargs -r gh cache delete
        # 删净断言：还有残留说明条目超过单页上限或别的 ref 仍有同名前缀，本趟不算冷编译
        left=$(gh cache list --limit 100 --json key | \
          jq '[.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-ccache-"))] | length')
        if [ "$left" != "0" ]; then
          echo "::error::清理后 ${{ env.CONFIG_NAME }}-ccache- 前缀仍剩 $left 条缓存条目，本趟不算冷编译"
          exit 1
        fi

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ env.CONFIG_NAME }}-ccache-${{ hashFiles('feeds.conf.default', 'an7581.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-ccache-

    # ----------------------------------------------------------
    # 步骤 6: 加载自定义 feeds 源（mosdns / lucky / airoha_npu 等在这里追加声明）
    # ----------------------------------------------------------
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SCRIPT_ADD_FEED_SOURCES
        cd openwrt
        $GITHUB_WORKSPACE/$SCRIPT_ADD_FEED_SOURCES

    # ----------------------------------------------------------
    # 步骤 7: 更新 feeds，拉取各源的软件包定义
    # ----------------------------------------------------------
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # ----------------------------------------------------------
    # 步骤 8: 安装 feeds 到编译环境（发布集里的包必须是 symlink 进 package/feeds/<name>/）
    # ----------------------------------------------------------
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ----------------------------------------------------------
    # 步骤 9: 还原 APK 仓库签名私钥（Secret: PONWRT_APK_PRIVATE_KEY，本工作流里是硬性前提）
    # ----------------------------------------------------------
    - name: Load repository signing key
      working-directory: openwrt
      env:
        PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
      run: |
        # 缺 Secret 必须在这里失败：package/Makefile:77 会在私钥不存在时 openssl ecparam -genkey
        # 现造一把随机的，索引照签、步骤照绿，但固件 /etc/apk/keys/ 里的公钥不认它，
        # 发上去的仓库在设备端全变 unspec，比报错难查得多。
        [ -n "$PONWRT_APK_PRIVATE_KEY" ] || {
          echo "::error::未配置 Secret PONWRT_APK_PRIVATE_KEY，发布出去的仓库签名不被固件信任"
          exit 1
        }
        umask 077
        printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
        openssl ec -in private-key.pem -pubout -out public-key.pem
        # 自检：还原出来的必须是能解析出私钥分区的 PEM，否则 --sign 会在索引阶段才报
        openssl ec -in private-key.pem -noout -check >/dev/null

    # ----------------------------------------------------------
    # 步骤 10: 设备配置复制成 openwrt/.config 并生成完整配置
    # 不 mv files/（那是固件镜像的出厂 overlay，本工作流不产镜像），不跑 set-firmware-defaults.sh
    # ----------------------------------------------------------
    - name: Load custom config
      run: |
        # 缺配置文件必须显式失败：写成 [ -e x ] && cp 时 set -e 不会终止步骤，
        # 会静默用源码仓库默认配置编到底，产出没有本项目软件包的仓库还显示成功。
        if [ ! -e "$CONFIG_FILE" ]; then
          echo "::error::缺少编译配置文件 $CONFIG_FILE（应位于本仓库根目录，检查工作流 CONFIG_FILE 与分支上的文件名是否一致）"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config
        # CONFIG_CCACHE=y 只写进 .config（rules.mk 读的就是它），与固件工作流同一处理才共用得上缓存
        printf '\n%s\n' 'CONFIG_CCACHE=y' >> openwrt/.config
        cd openwrt
        make defconfig
        grep -q '^CONFIG_CCACHE=y' .config || {
          echo "::error::CONFIG_CCACHE=y 没能进入 defconfig 结果，检查 $CONFIG_FILE 里是否有 CONFIG_DEVEL=y"
          exit 1
        }
        # 签名开关必须是 y：package/Makefile:199 只在 CONFIG_SIGNED_PACKAGES=y 时才传 --sign,
        # 关掉就会发出一个不带签名的仓库，与固件的口径不一致
        grep -q '^CONFIG_SIGNED_PACKAGES=y' .config || {
          echo "::error::$CONFIG_FILE 里 CONFIG_SIGNED_PACKAGES 不是 y，仓库不会被签名"
          exit 1
        }

    # ----------------------------------------------------------
    # 步骤 11: 预下载源码包，避免编译期网络超时
    # ----------------------------------------------------------
    - name: Download package
      run: |
        cd openwrt
        make download -j8 V=11

    # ----------------------------------------------------------
    # 步骤 12: 编出 host 版 apk 工具（打 apk 包 mkpkg 与生成索引 mkndx 都调它）
    # 整镜像那趟由 package/Makefile 的 //compile 顺带编出来；本工作流只调单包 compile 与
    # package/index，两者都没把它列为前提，必须显式编一次（include/subdir.mk 不生成 host 目标，
    # 所以用 package/<目录>/compile 形态，它内部靠 host-build.mk 的 "t: host-t" 先编 host）
    # ----------------------------------------------------------
    - name: Build host apk tool
      run: |
        cd openwrt
        make package/system/apk/compile
        [ -x staging_dir/host/bin/apk ] || {
          echo "::error::staging_dir/host/bin/apk 不存在，后面 mkpkg/mkndx 都会失败"
          exit 1
        }

    # ----------------------------------------------------------
    # 步骤 13: 只编发布集里被 .config 选中的 feed 包（清单来自 customfeeds.list）
    # 省掉的是内核与镜像组装；工具链和依赖（luci-base、lua 等）省不掉，缓存命中也要几十分钟
    # ----------------------------------------------------------
    - name: Compile feed packages
      run: |
        chmod +x $SCRIPT_BUILD_FEED_PACKAGES
        sh $SCRIPT_BUILD_FEED_PACKAGES openwrt

    # ----------------------------------------------------------
    # 步骤 14: 生成并签名各 feed 的 packages.adb（apk mkndx --sign private-key.pem）
    # ----------------------------------------------------------
    - name: Index repositories
      run: |
        cd openwrt
        make package/index

    # ----------------------------------------------------------
    # 步骤 15: 执行 publish-feed-repos.sh 把签名仓库拷成 Pages 站点目录并与出厂清单逐条对账
    # ----------------------------------------------------------
    - name: Stage feed repositories
      id: feeds
      run: |
        chmod +x $SCRIPT_PUBLISH_FEED_REPOS
        sh $SCRIPT_PUBLISH_FEED_REPOS openwrt
        echo "status=success" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 16: 检查站点目录内容
    # ----------------------------------------------------------
    - name: Check site contents
      if: (!cancelled())
      run: |
        find feed-site -type f -printf '%p %s\n' | sort
        df -hT

    # ----------------------------------------------------------
    # 步骤 17: 站点目录暂存成 Pages artifact（真正部署由 pages job 执行）
    # ----------------------------------------------------------
    - name: Upload Pages artifact
      if: steps.feeds.outputs.status == 'success' && !cancelled()
      uses: actions/upload-pages-artifact@v4
      with:
        path: feed-site

  # ------------------------------------------------------------
  # Pages 发布 job：整站替换, 站点上只留最近一趟发布的包
  # 站点地址 https://<owner>.github.io/<本仓库名>/packages/<arch>/<feed>/packages.adb
  # 开启前需把仓库 Settings → Pages 的 Source 设为 GitHub Actions, 否则本 job 失败
  # ------------------------------------------------------------
  pages:
    name: Deploy feed repos
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.result == 'success' && !cancelled()

    permissions:
      pages: write      # 允许部署 Pages 站点
      id-token: write   # 部署要用 OIDC token 向 GitHub 换 Pages 部署凭证

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 部署 publish job 暂存的 Pages artifact
      # ----------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
