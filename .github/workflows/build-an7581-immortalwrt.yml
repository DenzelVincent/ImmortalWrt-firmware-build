# ============================================================
# ImmortalWrt 固件编译工作流 (AN7581 XGS-PON)
# 目标设备: Nokia XG-040G-MD + FiberHome HG5382A (Airoha AN7581)
# 源码来源: https://github.com/DenzelVincent/ponwrt.git (分支运行时可选: master 基线 / bugfix 修复验证)
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Build ImmortalWrt Firmware (AN7581)
on:
  # 定时编译 (默认关闭，取消注释即可启用，cron 使用 UTC 时间)
  # schedule:
  #   - cron: "0 21 * * *"
  # 手动触发：可在 GitHub Actions 页面点击 "Run workflow" 按钮
  workflow_dispatch:
    inputs:
      # 源码分支：master 是 XGS-PON 基线，bugfix 承载修复；集合稳定故用 choice，新增分支须同步 master 副本
      repo_branch:
        description: ponwrt 源码分支（master 基线 / bugfix 修复验证）
        type: choice
        options:
          - master
          - bugfix
        default: master
      # 清空 dl 下载缓存，本趟全量重下、收尾重灌
      clean_dl_cache:
        description: 先清空 dl 下载缓存再编译（改了 package 的源码版本/地址、或怀疑 dl 里是旧包时勾选）
        type: boolean
        default: false
      # 清空 ccache 编译对象缓存，本趟全部未命中、收尾重灌
      clean_ccache:
        description: 先清空 ccache 编译对象缓存再编译（怀疑产物不对、需排除 ccache 时勾选）
        type: boolean
        default: false
      # Release 发布开关：关闭时只上传 artifact，不建 Release、不清理旧 runs
      release:
        description: 编译成功后创建 GitHub Release（默认关闭，关闭时只保留 artifact）
        type: boolean
        default: false

env:
  # 源码仓库地址
  REPO_URL: https://github.com/DenzelVincent/ponwrt.git
  # 源码分支：由运行输入决定，未传时回落 master（schedule/API 触发不带 inputs）
  REPO_BRANCH: ${{ inputs.repo_branch || 'master' }}
  # 设备配置文件（复制成 openwrt/.config）与缓存 key 前缀；改名须同步两条 cache key 里的文件名
  CONFIG_FILE: an7581.config
  CONFIG_NAME: an7581
  # 子目标（编译产物路径使用）；设备名映射登记在 organize-firmware.sh 的 device_label
  SUBTARGET: an7581
  # 四个自定义脚本 = 流程里的四个插入点，执行阶段见各行注释
  # 1) ./scripts/feeds update -a 之前 —— 增删增量 feed 源（mosdns / lucky）
  SCRIPT_ADD_FEED_SOURCES: add-feed-sources.sh
  # 2) ./scripts/feeds install -a 之后 —— 修 feed 包里 LuCI 表单「值等于默认值就删」的缺陷
  SCRIPT_PATCH_FEED_PACKAGES: patch-feed-packages.sh
  # 3) make defconfig 之后 —— 改固件出厂默认值 (默认 IP、DHCP 等)
  SCRIPT_SET_FIRMWARE_DEFAULTS: set-firmware-defaults.sh
  # 4) make 之后 —— 按设备归集镜像，输出设备清单供 package/release job 做 matrix
  SCRIPT_ORGANIZE_FIRMWARE: organize-firmware.sh
  # 编译环境时区
  TZ: Asia/Shanghai
  # 可选覆盖：本仓库根存在该文件时才覆盖源码自带 feeds
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    name: build-firmware
    runs-on: ubuntu-24.04

    # 设备清单与版本号跨 job 传递：package/release 按 devices 做 matrix，各自只处理一台
    outputs:
      devices: ${{ steps.organize.outputs.devices }}
      fw_version: ${{ steps.version.outputs.fw_version }}
      file_date: ${{ steps.compile.outputs.file_date }}
      src_sha: ${{ steps.version.outputs.src_sha }}
      src_branch: ${{ env.REPO_BRANCH }}

    permissions:
      actions: write    # 允许上传编译产物 artifact

    steps:
    # ----------------------------------------------------------
    # 步骤 1: 释放磁盘空间（删除 runner 上的 Android/.NET/Haskell 等工具链）
    # ----------------------------------------------------------
    - name: Free disk space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    # ----------------------------------------------------------
    # 步骤 2: 检出本仓库（设备配置文件与自定义脚本）
    # ----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    # ----------------------------------------------------------
    # 步骤 3: 安装编译依赖（完整工具链）
    # ----------------------------------------------------------
    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gettext git g++-multilib gcc-multilib gperf help2man intltool \
          libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
          python3 python3-docutils python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    # ----------------------------------------------------------
    # 步骤 4: 克隆源码到 /srcdir，解析固件版本号供产物名使用
    # ----------------------------------------------------------
    - name: Clone source code
      id: version
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt
        raw="$(grep -m1 -F 'VERSION_NUMBER:=$(if ' openwrt/include/version.mk)"
        ver="${raw%)}"
        ver="${ver##*,}"
        [ -n "$ver" ] || { echo "::error::没能从 openwrt/include/version.mk 解析出 VERSION_NUMBER"; exit 1; }
        echo "fw_version=$ver" >> $GITHUB_OUTPUT
        echo "src_sha=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 5: 缓存 dl/（源码包）与 openwrt/.ccache（编译对象），Clear 排在同层 Cache 之前
    # ----------------------------------------------------------
    - name: Clear dl cache
      if: ${{ inputs.clean_dl_cache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-dl-")) | .id' | \
          xargs -r gh cache delete
        left=$(gh cache list --limit 100 --json key | \
          jq '[.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-dl-"))] | length')
        if [ "$left" != "0" ]; then
          echo "::error::清理后 ${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-dl- 前缀仍剩 $left 条缓存条目，本趟不算冷编译"
          exit 1
        fi

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-dl-${{ hashFiles('feeds.conf.default', 'an7581.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-dl-

    - name: Clear ccache
      if: ${{ inputs.clean_ccache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-ccache-")) | .id' | \
          xargs -r gh cache delete
        left=$(gh cache list --limit 100 --json key | \
          jq '[.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-ccache-"))] | length')
        if [ "$left" != "0" ]; then
          echo "::error::清理后 ${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-ccache- 前缀仍剩 $left 条缓存条目，本趟不算冷编译"
          exit 1
        fi

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-ccache-${{ hashFiles('feeds.conf.default', 'an7581.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-${{ env.REPO_BRANCH }}-ccache-

    # ----------------------------------------------------------
    # 步骤 6: 执行 add-feed-sources.sh 增删第三方 feed 源
    # ----------------------------------------------------------
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SCRIPT_ADD_FEED_SOURCES
        cd openwrt
        $GITHUB_WORKSPACE/$SCRIPT_ADD_FEED_SOURCES

    # ----------------------------------------------------------
    # 步骤 7: 更新 feeds，拉取各源的软件包定义
    # ----------------------------------------------------------
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # ----------------------------------------------------------
    # 步骤 8: 安装 feeds 到编译环境，再按脚本修 feed 包里的 LuCI 表单缺陷
    # ----------------------------------------------------------
    # 必须排在 install 之后：package/feeds/<feed>/<pkg> 是指向 feeds/<name>/ 的软链，
    # 而 ./scripts/feeds update -a 会把补丁连根冲掉，所以顺序固定 update → install → 打补丁
    - name: Install feeds
      run: |
        chmod +x $SCRIPT_PATCH_FEED_PACKAGES
        cd openwrt
        ./scripts/feeds install -a
        $GITHUB_WORKSPACE/$SCRIPT_PATCH_FEED_PACKAGES

    # ----------------------------------------------------------
    # 步骤 9: 还原 APK 仓库签名私钥（Secret: PONWRT_APK_PRIVATE_KEY），缺失即失败
    # ----------------------------------------------------------
    - name: Load repository signing key
      working-directory: openwrt
      env:
        PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
      run: |
        # 缺 Secret 必须在这里失败：私钥不存在时构建系统会现造一把随机的，镜像 /etc/apk/keys/
        # 里的公钥就不认 Pages 上用固定私钥签的 feed 仓库，设备端 apk add 全变 unspec
        [ -n "$PONWRT_APK_PRIVATE_KEY" ] || {
          echo "::error::未配置 Secret PONWRT_APK_PRIVATE_KEY，产出的固件不认自建 feed 源的签名"
          exit 1
        }
        umask 077
        # 行尾归一化：Windows 侧粘贴的 PEM 常带 CRLF，openssl 能容忍，但 mkndx --sign 读的就是这个文件
        printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" | tr -d '\r' > private-key.pem
        # 私钥自洽校验：截断或粘成一行会在这里红，-pubout 只推导不查一致性
        openssl ec -in private-key.pem -noout -check >/dev/null
        openssl ec -in private-key.pem -pubout -out public-key.pem

    # ----------------------------------------------------------
    # 步骤 10: 复制设备配置并追加 CONFIG_CCACHE=y，make defconfig 后自检并执行出厂默认值脚本
    # ----------------------------------------------------------
    - name: Load custom config
      run: |
        if [ ! -e "$CONFIG_FILE" ]; then
          echo "::error::缺少编译配置文件 $CONFIG_FILE（应位于本仓库根目录，检查工作流 CONFIG_FILE 与分支上的文件名是否一致）"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config
        printf '\n%s\n' 'CONFIG_CCACHE=y' >> openwrt/.config
        chmod +x $SCRIPT_SET_FIRMWARE_DEFAULTS
        cd openwrt
        make defconfig
        grep -q '^CONFIG_CCACHE=y' .config || {
          echo "::error::CONFIG_CCACHE=y 没能进入 defconfig 结果，检查 $CONFIG_FILE 里是否有 CONFIG_DEVEL=y"
          exit 1
        }
        $GITHUB_WORKSPACE/$SCRIPT_SET_FIRMWARE_DEFAULTS

    # ----------------------------------------------------------
    # 步骤 11: 预下载源码包，避免编译期网络超时
    # ----------------------------------------------------------
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8 V=11

    # ----------------------------------------------------------
    # 步骤 12: 编译固件（同级并发重试一次，仍失败降级 -j1 V=s）
    # ----------------------------------------------------------
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j$(nproc) || make -j1 V=s || exit 1
        echo "status=success" >> $GITHUB_OUTPUT
        echo "file_date=_$(date +"%Y-%m-%d-%H-%M")" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 13: 检查磁盘使用情况
    # ----------------------------------------------------------
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # ----------------------------------------------------------
    # 步骤 14: 按设备把可刷写镜像收进 release/<设备>/，并输出设备清单
    # ----------------------------------------------------------
    - name: Organize firmware files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        chmod +x $SCRIPT_ORGANIZE_FIRMWARE
        $GITHUB_WORKSPACE/$SCRIPT_ORGANIZE_FIRMWARE

    # ----------------------------------------------------------
    # 步骤 15: 上传归集结果作为 job 间中转，每设备 artifact 由 package job 产出
    # ----------------------------------------------------------
    - name: Upload raw firmware
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: firmware-raw
        path: release/
        retention-days: 1

  # ------------------------------------------------------------
  # 打包 job：按设备各上传一个 artifact，命名 ImmortalWrt_<版本>_<设备>_<日期-时分>
  # 设备清单来自 build 的 organize 步骤，新增设备只需改配置与 device_label 映射
  # ------------------------------------------------------------
  package:
    name: package-${{ matrix.device }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && !cancelled()

    permissions:
      actions: write    # 允许上传每设备 artifact

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.build.outputs.devices) }}

    steps:
      # ----------------------------------------------------------
      # 步骤 1: 取回 build 归集好的镜像目录
      # ----------------------------------------------------------
      - name: Download raw firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-raw
          path: release

      # ----------------------------------------------------------
      # 步骤 2: 只上传本设备子目录（tar.zst 打包由 release job 执行）
      # ----------------------------------------------------------
      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        with:
          name: ImmortalWrt_${{ needs.build.outputs.fw_version }}_${{ matrix.device }}${{ needs.build.outputs.file_date }}
          path: release/${{ matrix.device }}

  # ------------------------------------------------------------
  # Release 发布 job：按设备各建一个 Release，并清理旧 runs / Releases
  # 由 workflow_dispatch 的 release 开关控制，默认关闭；关闭时只保留 artifact
  # 只在 master 分支发布：标签名不含分支，bugfix 发布会与正式版共用同一设备的 keep_latest 名额
  # 门控读 needs 而非 env：job 级 if 的可用上下文只有 github/needs/vars/inputs
  # ------------------------------------------------------------
  release:
    name: release-${{ matrix.device }}
    runs-on: ubuntu-latest
    needs: [build, package]
    if: needs.build.result == 'success' && !cancelled() && inputs.release && needs.build.outputs.src_branch == 'master'

    permissions:
      contents: write   # 允许创建 Release
      actions: write    # 允许删除/管理 workflow runs

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.build.outputs.devices) }}

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 下载本设备的 artifact（命名约定见 package job 步骤 2）
      # ----------------------------------------------------------
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmortalWrt_${{ needs.build.outputs.fw_version }}_${{ matrix.device }}${{ needs.build.outputs.file_date }}
          path: firmware

      # ----------------------------------------------------------
      # 步骤 2: 把本设备散文件目录打包成 immortalwrt-<设备>.tar.zst
      # ----------------------------------------------------------
      - name: Package firmware
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          mkdir -p release
          tar --zstd -cf "release/immortalwrt-${DEVICE}.tar.zst" -C firmware .
          ls -l release/

      # ----------------------------------------------------------
      # 步骤 3: 生成 Release 标签与说明（版本号/时间戳取自 build job 输出，不反解 artifact 名）
      # ----------------------------------------------------------
      - name: Generate release tag
        id: tag
        env:
          DEVICE: ${{ matrix.device }}
          FW: ${{ needs.build.outputs.fw_version }}
          FILE_DATE: ${{ needs.build.outputs.file_date }}
          SRC_BRANCH: ${{ needs.build.outputs.src_branch }}
          SRC_SHA: ${{ needs.build.outputs.src_sha }}
        run: |
          # file_date 带前导下划线（沿用 artifact 名拼接约定），标签里要去掉
          ts="${FILE_DATE#_}"
          echo "release_tag=ImmortalWrt_${FW}_${DEVICE}_${ts}" >> $GITHUB_OUTPUT
          echo "ImmortalWrt ${FW} for ${DEVICE} (Airoha AN7581)" > release.txt
          echo "源码: DenzelVincent/ponwrt@${SRC_BRANCH} (${SRC_SHA})" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 4: 上传固件压缩包到本设备的 GitHub Release
      # ----------------------------------------------------------
      - name: Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: release/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 步骤 5: 清理旧 workflow runs（保留 7 天，至少 3 条）；整个 run 只需清一次，只跑首个 matrix 分支
      # ----------------------------------------------------------
      - name: Delete workflow runs
        if: strategy.job-index == 0
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      # ----------------------------------------------------------
      # 步骤 6: 清理旧 Release（本设备标签保留最近 3 个，连 tag 一起删）
      # ----------------------------------------------------------
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outcome == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
          delete_tag_pattern: _${{ matrix.device }}_
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
