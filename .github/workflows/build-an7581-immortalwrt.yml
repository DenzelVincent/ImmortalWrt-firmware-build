# ============================================================
# ImmortalWrt 固件编译工作流 (AN7581 XGS-PON)
# 目标设备: Nokia XG-040G-MD (Airoha AN7581)
# 源码来源: https://github.com/DenzelVincent/ponwrt.git (master 分支)
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Build ImmortalWrt Firmware (AN7581)
on:
  # 定时编译 (默认关闭，取消注释即可启用，cron 使用 UTC 时间)
  # schedule:
  #   - cron: "0 21 * * *"
  # 手动触发：可在 GitHub Actions 页面点击 "Run workflow" 按钮
  workflow_dispatch:
    inputs:
      # 清空 dl 下载缓存，本趟全量重下、收尾重灌
      clean_dl_cache:
        description: 先清空 dl 下载缓存再编译（改了 package 的源码版本/地址、或怀疑 dl 里是旧包时勾选）
        type: boolean
        default: false
      # 清空 ccache 编译对象缓存，本趟全部未命中、收尾重灌
      clean_ccache:
        description: 先清空 ccache 编译对象缓存再编译（怀疑产物不对、需排除 ccache 时勾选）
        type: boolean
        default: false
      # Release 发布开关：关闭时只上传 artifact，不建 Release、不清理旧 runs
      release:
        description: 编译成功后创建 GitHub Release（默认关闭，关闭时只保留 artifact）
        type: boolean
        default: false

env:
  # 源码仓库地址
  REPO_URL: https://github.com/DenzelVincent/ponwrt.git
  # 源码分支：AN7581 使用 master 分支（XGS-PON 基线）
  REPO_BRANCH: master
  # 设备配置文件（复制成 openwrt/.config）与缓存 key 前缀；改名须同步两条 cache key 里的文件名
  CONFIG_FILE: an7581.config
  CONFIG_NAME: an7581
  # 目标设备和子目标（编译产物路径使用）
  DEVICE_NAME: XG-040G-MD
  SUBTARGET: an7581
  # 三个自定义脚本 = 流程里的三个插入点，执行阶段见各行注释
  # 1) ./scripts/feeds update -a 之前 —— 增删增量 feed 源（mosdns / lucky / airoha_npu）
  SCRIPT_ADD_FEED_SOURCES: add-feed-sources.sh
  # 2) ./scripts/feeds install -a 之后 —— 修 feed 包里 LuCI 表单「值等于默认值就删」的缺陷
  SCRIPT_PATCH_FEED_PACKAGES: patch-feed-packages.sh
  # 3) make defconfig 之后 —— 改固件出厂默认值 (默认 IP、DHCP 等)
  SCRIPT_SET_FIRMWARE_DEFAULTS: set-firmware-defaults.sh
  # 编译环境时区
  TZ: Asia/Shanghai
  # 可选覆盖：本仓库根存在该文件时才覆盖源码自带 feeds
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    name: build-firmware
    runs-on: ubuntu-24.04

    permissions:
      actions: write    # 允许上传编译产物 artifact

    steps:
    # ----------------------------------------------------------
    # 步骤 1: 释放磁盘空间（删除 runner 上的 Android/.NET/Haskell 等工具链）
    # ----------------------------------------------------------
    - name: Free disk space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    # ----------------------------------------------------------
    # 步骤 2: 检出本仓库（设备配置文件与自定义脚本）
    # ----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    # ----------------------------------------------------------
    # 步骤 3: 安装编译依赖（完整工具链）
    # ----------------------------------------------------------
    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gettext git g++-multilib gcc-multilib gperf help2man intltool \
          libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
          python3 python3-docutils python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    # ----------------------------------------------------------
    # 步骤 4: 克隆源码到 /srcdir，解析固件版本号供产物名使用
    # ----------------------------------------------------------
    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt
        raw="$(grep -m1 -F 'VERSION_NUMBER:=$(if ' openwrt/include/version.mk)"
        ver="${raw%)}"
        ver="${ver##*,}"
        [ -n "$ver" ] || { echo "::error::没能从 openwrt/include/version.mk 解析出 VERSION_NUMBER"; exit 1; }
        echo "FW_VERSION=$ver" >> $GITHUB_ENV

    # ----------------------------------------------------------
    # 步骤 5: 缓存 dl/（源码包）与 openwrt/.ccache（编译对象），Clear 排在同层 Cache 之前
    # ----------------------------------------------------------
    - name: Clear dl cache
      if: ${{ inputs.clean_dl_cache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-dl-")) | .id' | \
          xargs -r gh cache delete
        left=$(gh cache list --limit 100 --json key | \
          jq '[.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-dl-"))] | length')
        if [ "$left" != "0" ]; then
          echo "::error::清理后 ${{ env.CONFIG_NAME }}-dl- 前缀仍剩 $left 条缓存条目，本趟不算冷编译"
          exit 1
        fi

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ env.CONFIG_NAME }}-dl-${{ hashFiles('feeds.conf.default', 'an7581.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-dl-

    - name: Clear ccache
      if: ${{ inputs.clean_ccache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-ccache-")) | .id' | \
          xargs -r gh cache delete
        left=$(gh cache list --limit 100 --json key | \
          jq '[.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-ccache-"))] | length')
        if [ "$left" != "0" ]; then
          echo "::error::清理后 ${{ env.CONFIG_NAME }}-ccache- 前缀仍剩 $left 条缓存条目，本趟不算冷编译"
          exit 1
        fi

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ env.CONFIG_NAME }}-ccache-${{ hashFiles('feeds.conf.default', 'an7581.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-ccache-

    # ----------------------------------------------------------
    # 步骤 6: 执行 add-feed-sources.sh 增删第三方 feed 源
    # ----------------------------------------------------------
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SCRIPT_ADD_FEED_SOURCES
        cd openwrt
        $GITHUB_WORKSPACE/$SCRIPT_ADD_FEED_SOURCES

    # ----------------------------------------------------------
    # 步骤 7: 更新 feeds，拉取各源的软件包定义
    # ----------------------------------------------------------
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # ----------------------------------------------------------
    # 步骤 8: 安装 feeds 到编译环境，再按脚本修 feed 包里的 LuCI 表单缺陷
    # ----------------------------------------------------------
    # 必须排在 install 之后：package/feeds/<feed>/<pkg> 是指向 feeds/<name>/ 的软链，
    # 而 ./scripts/feeds update -a 会把补丁连根冲掉，所以顺序固定 update → install → 打补丁
    - name: Install feeds
      run: |
        chmod +x $SCRIPT_PATCH_FEED_PACKAGES
        cd openwrt
        ./scripts/feeds install -a
        $GITHUB_WORKSPACE/$SCRIPT_PATCH_FEED_PACKAGES

    # ----------------------------------------------------------
    # 步骤 9: 还原 APK 仓库签名私钥（Secret: PONWRT_APK_PRIVATE_KEY），缺失即失败
    # ----------------------------------------------------------
    - name: Load repository signing key
      working-directory: openwrt
      env:
        PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
      run: |
        # 缺 Secret 必须在这里失败：私钥不存在时构建系统会现造一把随机的，镜像 /etc/apk/keys/
        # 里的公钥就不认 Pages 上用固定私钥签的 feed 仓库，设备端 apk add 全变 unspec
        [ -n "$PONWRT_APK_PRIVATE_KEY" ] || {
          echo "::error::未配置 Secret PONWRT_APK_PRIVATE_KEY，产出的固件不认自建 feed 源的签名"
          exit 1
        }
        umask 077
        # 行尾归一化：Windows 侧粘贴的 PEM 常带 CRLF，openssl 能容忍，但 mkndx --sign 读的就是这个文件
        printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" | tr -d '\r' > private-key.pem
        # 私钥自洽校验：截断或粘成一行会在这里红，-pubout 只推导不查一致性
        openssl ec -in private-key.pem -noout -check >/dev/null
        openssl ec -in private-key.pem -pubout -out public-key.pem

    # ----------------------------------------------------------
    # 步骤 10: 复制设备配置并追加 CONFIG_CCACHE=y，make defconfig 后自检并执行出厂默认值脚本
    # ----------------------------------------------------------
    - name: Load custom config
      run: |
        [ -e files ] && mv files openwrt/files
        if [ ! -e "$CONFIG_FILE" ]; then
          echo "::error::缺少编译配置文件 $CONFIG_FILE（应位于本仓库根目录，检查工作流 CONFIG_FILE 与分支上的文件名是否一致）"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config
        printf '\n%s\n' 'CONFIG_CCACHE=y' >> openwrt/.config
        chmod +x $SCRIPT_SET_FIRMWARE_DEFAULTS
        cd openwrt
        make defconfig
        grep -q '^CONFIG_CCACHE=y' .config || {
          echo "::error::CONFIG_CCACHE=y 没能进入 defconfig 结果，检查 $CONFIG_FILE 里是否有 CONFIG_DEVEL=y"
          exit 1
        }
        $GITHUB_WORKSPACE/$SCRIPT_SET_FIRMWARE_DEFAULTS

    # ----------------------------------------------------------
    # 步骤 11: 预下载源码包，避免编译期网络超时
    # ----------------------------------------------------------
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8 V=11

    # ----------------------------------------------------------
    # 步骤 12: 编译固件（同级并发重试一次，仍失败降级 -j1 V=s）
    # ----------------------------------------------------------
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j$(nproc) || make -j1 V=s || exit 1
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y-%m-%d-%H-%M")" >> $GITHUB_ENV

    # ----------------------------------------------------------
    # 步骤 13: 检查磁盘使用情况
    # ----------------------------------------------------------
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # ----------------------------------------------------------
    # 步骤 14: 把可刷写镜像收进 release/<设备>/
    # ----------------------------------------------------------
    - name: Organize firmware files
      id: organize
      if: (!cancelled())
      run: |
        echo "DEVICE=$DEVICE_NAME" >> $GITHUB_ENV
        mkdir -p "release/$DEVICE_NAME"
        for f in openwrt/bin/targets/airoha/${SUBTARGET}/*.bin openwrt/bin/targets/airoha/${SUBTARGET}/*.itb; do
          [ -e "$f" ] || continue
          cp "$f" "release/$DEVICE_NAME/"
        done
        ls -l "release/$DEVICE_NAME"
        echo "status=success" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 15: 上传 release/<设备> 散文件目录为 artifact（tar.zst 打包由 release job 执行）
    # ----------------------------------------------------------
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_${{ env.FW_VERSION }}_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: release/${{ env.DEVICE }}

  # ------------------------------------------------------------
  # Release 发布 job：编译成功后打包上传 Release，并清理旧 runs / Releases
  # 由 workflow_dispatch 的 release 开关控制，默认关闭；关闭时只保留 artifact
  # ------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && !cancelled() && inputs.release

    permissions:
      contents: write   # 允许创建 Release
      actions: write    # 允许删除/管理 workflow runs

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 下载本次 run 的固件 artifact（按 artifact 名前缀取，命名约定见 build 步骤 15）
      # ----------------------------------------------------------
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ImmortalWrt_*
          merge-multiple: false
          path: artifacts

      # ----------------------------------------------------------
      # 步骤 2: 把各散文件目录打包成 immortalwrt-<设备>.tar.zst（设备名从 artifact 名反解，约定见步骤 3）
      # ----------------------------------------------------------
      - name: Package firmware by device
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            device="$(echo "$name" | sed -E 's/^ImmortalWrt_[^_]*_//; s/_[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}$//')"
            tar --zstd -cf "release/immortalwrt-${device}.tar.zst" -C "$d" .
            echo "Packaged $device -> release/immortalwrt-${device}.tar.zst"
          done
          ls -l release/

      # ----------------------------------------------------------
      # 步骤 3: 版本号与时间戳从 artifact 名回取，生成 Release 标签与说明
      # ----------------------------------------------------------
      - name: Generate release tag
        id: tag
        run: |
          # 约定 artifact 名 ImmortalWrt_<版本>_<型号>_<日期-时分>；build job 的 env 不跨 job，只能回取
          first="$(ls -1 artifacts | head -1)"
          [[ "$first" =~ ^ImmortalWrt_([0-9A-Za-z.-]+)_(.+)_([0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2})$ ]] || { echo "::error::artifact 名不符合命名约定: $first"; exit 1; }
          fw="${BASH_REMATCH[1]}"
          ts="${BASH_REMATCH[3]}"
          echo "release_tag=ImmortalWrt_${fw}_${DEVICE_NAME}_${ts}" >> $GITHUB_OUTPUT
          touch release.txt
          echo "ImmortalWrt ${fw} for Nokia XG-040G-MD (Airoha AN7581)" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 4: 上传固件压缩包到 GitHub Release
      # ----------------------------------------------------------
      - name: Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: release/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 步骤 5: 清理旧 workflow runs（保留 7 天，至少 3 条）
      # ----------------------------------------------------------
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      # ----------------------------------------------------------
      # 步骤 6: 清理旧 Release（本设备标签保留最近 3 个，连 tag 一起删）
      # ----------------------------------------------------------
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outcome == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
          delete_tag_pattern: _XG-040G-MD_
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
